services:
  db:
    image: postgres:16
    container_name: crypto-db
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # data survives "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
