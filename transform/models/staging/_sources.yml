version: 2

sources:
  - name: raw
    description: Tables written by the Python loader (crypto_pipeline.load).
    schema: public
    tables:
      - name: raw_daily_prices
        description: One row per coin per day, price snapshot at 00:00 UTC.
        loaded_at_field: loaded_at
        freshness:  # `dbt source freshness` warns/errors if the loader stops
          warn_after: {count: 36, period: hour}
          error_after: {count: 72, period: hour}
      - name: coins
        description: The coins we track, with ticker symbol and display name.
