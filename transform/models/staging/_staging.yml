version: 2

models:
  - name: stg_coins
    columns:
      - name: coin_id
        data_tests: [unique, not_null]
      - name: symbol
        data_tests: [unique, not_null]

  - name: stg_daily_prices
    columns:
      - name: coin_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_coins')
                field: coin_id
      - name: price_date
        data_tests: [not_null]
      - name: price_gbp
        data_tests:
          - not_null
          - between:
              arguments:
                min_value: 0
                inclusive: false
